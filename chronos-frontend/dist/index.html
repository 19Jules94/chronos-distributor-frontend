<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chronos-frontend</title>
    <script type="module" crossorigin src="./assets/index-DRDXIza5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BSJqPH5m.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Snackbar no bloqueante que sustituye a window.alert -->
    <style>
      .__toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:2147483647;pointer-events:none}
      .__toast{min-width:240px;max-width:min(92vw,560px);padding:12px 16px;background:rgba(32,32,32,.95);color:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.35;opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease}
      .__toast.show{opacity:1;transform:translateY(0)}
    </style>
    <script>
      (function(){
        // contenedor
        const wrap = document.createElement('div');
        wrap.id='__toast-wrap'; wrap.className='.__toast-wrap'.slice(1);
        wrap.setAttribute('aria-live','polite'); wrap.setAttribute('aria-atomic','true');
        document.body.appendChild(wrap);

        function showToast(message, ms=4000){
          const el=document.createElement('div');
          el.className='.__toast'.slice(1);
          el.textContent=String(message ?? '');
          wrap.appendChild(el);
          requestAnimationFrame(()=>el.classList.add('show'));
          setTimeout(()=>{el.classList.remove('show'); el.addEventListener('transitionend',()=>el.remove(),{once:true});}, ms);
        }

        const _native=window.alert.bind(window);
        window.alert=function(msg){ try{ showToast(msg); } catch(e){ _native(msg); } };
        // opcionalmente expón el helper:
        window.showToast = showToast;
      })();
    </script>

    <!-- Tu app: se carga después para que alert() ya esté parcheado -->
  </body>
</html>
